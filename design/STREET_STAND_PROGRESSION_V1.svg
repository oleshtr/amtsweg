<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AMTSWEG Street Stand Progression V1</title>
  <desc id="desc">Five visual upgrade stages from improvised campaign table to professional campaign pavilion.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #182238; }
    .title { font-size: 34px; font-weight: 800; }
    .label { font-size: 20px; font-weight: 800; }
    .small { font-size: 14px; font-weight: 700; fill: #5f6c7d; }
    .panel { fill: #eef3f5; stroke: #182238; stroke-width: 4; }
    .pixel { shape-rendering: crispEdges; }
  </style>
  <rect width="1600" height="900" fill="#d8e2e8"/>
  <rect x="28" y="28" width="1544" height="844" rx="18" fill="#fffaf0" stroke="#182238" stroke-width="6"/>
  <text x="62" y="82" class="title">AMTSWEG — STRASSENSTAND PROGRESSION V1</text>
  <text x="62" y="112" class="small">Jedes Upgrade verändert die Welt sichtbar. Keine reine Zahlenprogression.</text>

  <g transform="translate(52 160)">
    <rect class="panel" x="0" y="0" width="286" height="610" rx="14"/>
    <text x="20" y="42" class="label">LEVEL 1</text><text x="20" y="68" class="small">Tapeziertisch</text>
    <g class="pixel" transform="translate(36 198)">
      <rect x="20" y="120" width="180" height="20" fill="#c59a68" stroke="#182238" stroke-width="5"/>
      <rect x="36" y="140" width="15" height="90" fill="#6e747a"/><rect x="168" y="140" width="15" height="90" fill="#6e747a"/>
      <rect x="75" y="105" width="42" height="10" fill="#f5df9f"/><rect x="122" y="105" width="42" height="10" fill="#f5df9f"/>
      <rect x="4" y="174" width="36" height="48" fill="#d7c7a2" stroke="#182238" stroke-width="4"/>
    </g>
    <text x="20" y="500" class="small">• 1 Figur</text><text x="20" y="526" class="small">• Flyer-Stapel</text><text x="20" y="552" class="small">• bewusst improvisiert</text>

    <rect class="panel" x="306" y="0" width="286" height="610" rx="14"/>
    <text x="326" y="42" class="label">LEVEL 3</text><text x="326" y="68" class="small">Ordentlicher Infotisch</text>
    <g class="pixel" transform="translate(332 170)">
      <rect x="22" y="135" width="180" height="20" fill="#c59a68" stroke="#182238" stroke-width="5"/>
      <rect x="36" y="155" width="15" height="90" fill="#6e747a"/><rect x="172" y="155" width="15" height="90" fill="#6e747a"/>
      <rect x="60" y="155" width="100" height="48" fill="#2f72aa" stroke="#182238" stroke-width="4"/>
      <text x="79" y="186" font-size="16" font-weight="800" fill="#ffffff">AMTSWEG</text>
