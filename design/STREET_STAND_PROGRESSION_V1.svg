    <text x="938" y="42" class="label">LEVEL 10</text><text x="938" y="68" class="small">Pavillon</text>
    <g class="pixel" transform="translate(944 126)">
      <polygon points="16,90 112,30 208,90" fill="#2f72aa" stroke="#182238" stroke-width="5"/>
      <rect x="24" y="90" width="8" height="210" fill="#26394d"/><rect x="192" y="90" width="8" height="210" fill="#26394d"/>
      <rect x="38" y="196" width="150" height="18" fill="#c59a68" stroke="#182238" stroke-width="4"/>
      <rect x="54" y="214" width="14" height="68" fill="#6e747a"/><rect x="160" y="214" width="14" height="68" fill="#6e747a"/>
      <rect x="76" y="214" width="76" height="42" fill="#2f72aa" stroke="#182238" stroke-width="4"/>
      <text x="84" y="240" font-size="13" font-weight="800" fill="#ffffff">AMTSWEG</text>
      <rect x="46" y="126" width="54" height="52" fill="#f4f1e8" stroke="#182238" stroke-width="4"/><rect x="126" y="126" width="54" height="52" fill="#f4f1e8" stroke="#182238" stroke-width="4"/>
    </g>
    <text x="938" y="500" class="small">• Überdachung</text><text x="938" y="526" class="small">• zwei Helfer sichtbar</text><text x="938" y="552" class="small">• Banner / Plakate</text>

    <rect class="panel" x="1224" y="0" width="286" height="610" rx="14"/>
    <text x="1244" y="42" class="label">LEVEL 20</text><text x="1244" y="68" class="small">Kampagnenstand</text>
    <g class="pixel" transform="translate(1248 112)">
      <polygon points="4,88 110,18 216,88" fill="#253a56" stroke="#182238" stroke-width="5"/>
      <rect x="16" y="88" width="8" height="220" fill="#182238"/><rect x="196" y="88" width="8" height="220" fill="#182238"/>
      <rect x="24" y="96" width="180" height="32" fill="#2f72aa" stroke="#182238" stroke-width="4"/>
      <text x="63" y="118" font-size="15" font-weight="800" fill="#ffffff">AMTSWEG</text>
      <rect x="38" y="198" width="150" height="20" fill="#bf9364" stroke="#182238" stroke-width="4"/>
      <rect x="54" y="218" width="14" height="76" fill="#666d73"/><rect x="160" y="218" width="14" height="76" fill="#666d73"/>
      <rect x="78" y="218" width="72" height="48" fill="#2f72aa" stroke="#182238" stroke-width="4"/>
      <circle cx="48" cy="148" r="10" fill="#f0c14d" stroke="#182238" stroke-width="3"/><circle cx="180" cy="148" r="10" fill="#f0c14d" stroke="#182238" stroke-width="3"/>
      <rect x="212" y="104" width="8" height="190" fill="#626971"/><rect x="220" y="104" width="40" height="108" fill="#f4f1e8" stroke="#182238" stroke-width="4"/>
      <rect x="-20" y="236" width="54" height="54" fill="#d6c093" stroke="#182238" stroke-width="4"/>
    </g>
    <text x="1244" y="500" class="small">• Banner + Licht</text><text x="1244" y="526" class="small">• mehrere Arbeitsplätze</text><text x="1244" y="552" class="small">• Endstufe des Standorts</text>
