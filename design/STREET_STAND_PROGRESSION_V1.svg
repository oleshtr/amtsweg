    <text x="632" y="42" class="label">LEVEL 5</text><text x="632" y="68" class="small">Roll-up + Ausstattung</text>
    <g class="pixel" transform="translate(638 150)">
      <rect x="22" y="160" width="180" height="20" fill="#c59a68" stroke="#182238" stroke-width="5"/>
      <rect x="35" y="180" width="15" height="86" fill="#6e747a"/><rect x="174" y="180" width="15" height="86" fill="#6e747a"/>
      <rect x="58" y="180" width="105" height="48" fill="#2f72aa" stroke="#182238" stroke-width="4"/>
      <text x="76" y="210" font-size="16" font-weight="800" fill="#ffffff">AMTSWEG</text>
      <rect x="208" y="44" width="12" height="222" fill="#616870"/><rect x="220" y="44" width="56" height="136" fill="#f4f1e8" stroke="#182238" stroke-width="4"/>
      <rect x="232" y="58" width="32" height="44" fill="#2f72aa"/><rect x="230" y="116" width="36" height="8" fill="#b45e50"/>
      <rect x="4" y="204" width="40" height="58" fill="#d9c49a" stroke="#182238" stroke-width="4"/>
